name: Docs Update
on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.mike.yml'
      - 'README.md'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'SECURITY.md'
      - 'CHANGELOG.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '**/SKILL.md'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Pinned on purpose (LEDGER 6.69): the docs build does not depend on the interpreter and 3.14 is the version the mkdocstrings setup was verified on; the test matrix in ci.yml owns every supported version.
          python-version: '3.14'

      - name: Install dependencies
        run: |
          pip install uv==0.13.4
          uv sync --locked --python 3.14 --extra dev --group docs

      - name: Build documentation
        run: uv run --no-sync mkdocs build --strict

      - name: Lint documentation
        run: |
          uv run --no-sync pymarkdownlnt scan -r -e ./.venv -e ./.git -e ./.github -e ./data -e ./guard -e ./tests .

      - name: Configure Git user
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Get and Update Version
        id: get_version
        run: |
          CURRENT_VERSION=$(uv run --no-sync yq -r '.aliases.latest' .mike.yml)

          if [[ ! $CURRENT_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format in .mike.yml: $CURRENT_VERSION"
            exit 1
          fi
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> "$GITHUB_ENV"

          if [[ -n "${{ secrets.DOCS_VERSION }}" ]]; then
            STORED_VERSION=${{ secrets.DOCS_VERSION }}
            echo "STORED_VERSION=$STORED_VERSION" >> "$GITHUB_ENV"
          else
            echo "::error::DOCS_VERSION secret not found"
            exit 1
          fi

          if [[ "$CURRENT_VERSION" != "$STORED_VERSION" ]]; then
            echo "::notice::Updating DOCS_VERSION from $STORED_VERSION to $CURRENT_VERSION"
            echo "VERSION=$CURRENT_VERSION" >> "$GITHUB_ENV"
            echo "UPDATE_SECRET=true" >> "$GITHUB_ENV"
          else
            echo "::notice::Versions match ($CURRENT_VERSION), no update needed"
            echo "VERSION=$STORED_VERSION" >> "$GITHUB_ENV"
            echo "UPDATE_SECRET=false" >> "$GITHUB_ENV"
          fi

      - name: Update Docs Version Secret
        if: ${{ env.UPDATE_SECRET == 'true' }}
        uses: rennf93/github-actions-secrets-mgmt@6dc05c707be6f28e69a4570fa705687881933b8b # v1.5
        with:
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.event.repository.name }}
          ACCESS_TOKEN: ${{ secrets.PAT_TOKEN }}
          SECRET_NAME: DOCS_VERSION
          SECRET_VALUE: ${{ env.VERSION }}

      - name: Deploy documentation
        run: |
          uv run --no-sync mike deploy --push "${VERSION}"
          uv run --no-sync mike alias --update-aliases --push "${VERSION}" latest
          uv run --no-sync mike set-default --push latest

      - name: Deploy to GitHub Pages
        run: |
          uv run --no-sync mike list
          git push origin gh-pages --force

      - name: Update Context7 Documentation
        id: context7
        uses: rennf93/upsert-context7@c29ca04a37ecbab62635c0e94c3d8908049b9ed5 # 1.1
        with:
          operation: refresh

      - name: Show result
        run: |
          echo "Success: ${STEPS_CONTEXT7_OUTPUTS_SUCCESS}"
          echo "Status: ${STEPS_CONTEXT7_OUTPUTS_STATUS_CODE}"
          echo "Message: ${STEPS_CONTEXT7_OUTPUTS_MESSAGE}"
        env:
          STEPS_CONTEXT7_OUTPUTS_SUCCESS: ${{ steps.context7.outputs.success }}
          STEPS_CONTEXT7_OUTPUTS_STATUS_CODE: ${{ steps.context7.outputs.status-code }}
          STEPS_CONTEXT7_OUTPUTS_MESSAGE: ${{ steps.context7.outputs.message }}

