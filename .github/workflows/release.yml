name: Publish to PyPI

on:
  release:
    types: [created]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-gate:
    name: ci-gate
    # Dispatches the PR CI (ci.yml) at this release's ref and waits for that run: the release never runs a weaker gate.
    # The dispatched run's head_sha is checked against this run's commit, so a moved ref cannot pass the gate.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: write # dispatch ci.yml and watch its run (GITHUB_TOKEN dispatches always create runs)
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_REF: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Dispatch ci.yml at the release ref and wait for the run
        run: |
          set -euo pipefail
          run_id="$(gh api --method POST "repos/${GH_REPO}/actions/workflows/ci.yml/dispatches" -f ref="$RELEASE_REF" -F return_run_details=true --jq .workflow_run_id)"
          [[ -n "$run_id" ]] || { echo "::error::dispatch returned no run id"; exit 1; }
          echo "dispatched ci.yml at $RELEASE_REF as run $run_id"
          head_sha="$(gh api "repos/${GH_REPO}/actions/runs/${run_id}" --jq .head_sha)"
          if [[ "$head_sha" != "$RELEASE_SHA" ]]; then
            echo "::error::ci.yml ran at $head_sha, not at the release commit $RELEASE_SHA"
            exit 1
          fi
          gh run watch "$run_id" --exit-status --interval 30

  cve-scan:
    name: cve-scan
    # The release never runs a weaker gate than a pull request (spec 14.3b); on a release event the SBOM is attached to the release.
    permissions:
      contents: write # attach the SBOM to the release
      security-events: write # SARIF
    uses: Guard-Core/.github/.github/workflows/cve-scan.yml@b77067336bbd96d7b8244ca425de197bdcf0001c # cve-scan (merged commit)
    with:
      tools_ref: b77067336bbd96d7b8244ca425de197bdcf0001c
      release_tag: ${{ github.event.release.tag_name }}

  publish:
    name: publish
    needs: [ci-gate, cve-scan]
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: '3.10'
      UV_PYTHON_DOWNLOADS: never
    environment: pypi
    permissions:
      id-token: write # trusted publishing: the registry login uses the GitHub OIDC token
      contents: read # check out the repository

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Packaging only (the wheel is pure Python); the matrix gate is the ci-gate job above.
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install uv==0.13.4
          uv sync --locked --only-group release --no-install-project

      - name: Build package
        run: |
          uv run --no-sync python -m build

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      - name: Get and Update Version
        id: get_version
        run: |
          CURRENT_VERSION=$(yq -r '.aliases.latest' .mike.yml)

          if [[ ! $CURRENT_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format in .mike.yml: $CURRENT_VERSION"
            exit 1
          fi
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> "$GITHUB_ENV"

          if [[ -n "${DOCS_VERSION}" ]]; then
            STORED_VERSION=${DOCS_VERSION}
            echo "STORED_VERSION=$STORED_VERSION" >> "$GITHUB_ENV"
          else
            echo "::error::DOCS_VERSION secret not found"
            exit 1
          fi

          if [[ "$CURRENT_VERSION" != "$STORED_VERSION" ]]; then
            echo "::notice::Updating DOCS_VERSION from $STORED_VERSION to $CURRENT_VERSION"
            echo "VERSION=$CURRENT_VERSION" >> "$GITHUB_ENV"
            echo "UPDATE_SECRET=true" >> "$GITHUB_ENV"
          else
            echo "::notice::Versions match ($CURRENT_VERSION), no update needed"
            echo "VERSION=$STORED_VERSION" >> "$GITHUB_ENV"
            echo "UPDATE_SECRET=false" >> "$GITHUB_ENV"
          fi
        env:
          DOCS_VERSION: ${{ secrets.DOCS_VERSION }}

      - name: Update Docs Version Secret
        if: ${{ env.UPDATE_SECRET == 'true' }}
        uses: rennf93/github-actions-secrets-mgmt@6dc05c707be6f28e69a4570fa705687881933b8b # v1.5
        with:
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.event.repository.name }}
          ACCESS_TOKEN: ${{ secrets.PAT_TOKEN }}
          SECRET_NAME: DOCS_VERSION
          SECRET_VALUE: ${{ github.event.release.tag_name }}

