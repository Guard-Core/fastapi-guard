name: Lock Security

on:
  schedule:
    # Off-minute on purpose: the top of the hour is when scheduled runs queue up and get dropped.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read # check out the repository

concurrency:
  group: lock-security
  cancel-in-progress: false

jobs:
  decide:
    name: decide
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      relock: ${{ steps.decision.outputs.relock }}
      issues: ${{ steps.decision.outputs.issues }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install the locked tools
        run: |
          pip install uv==0.13.4
          uv sync --locked --python 3.14 --extra dev

      - name: Audit the committed lock and decide
        id: decision
        run: |
          uv run --no-sync python .github/scripts/lock_security.py --decision decision.json --lock-out uv.lock.new
          uv run --no-sync python .github/scripts/lock_security.py --repo tools/semgrep --decision decision-semgrep.json --lock-out tools/semgrep/uv.lock.new
          {
            echo "Hourly lock security run (D-157). Only uv.lock and tools/semgrep/uv.lock change."
            echo
            jq -r '.fixed[] | "- \(.package) \(.from) to \(.to), the first version that fixes every advisory against it"' decision.json
            jq -r '.fixed[] | "- tools/semgrep: \(.package) \(.from) to \(.to), the first version that fixes every advisory against it"' decision-semgrep.json
            jq -r 'if .first_party_changed then "- first-party releases inside the allowed range (" + (.first_party | join(", ")) + ")" else empty end' decision.json
            echo
            echo "CI starts through a workflow_dispatch on this branch: events caused by GITHUB_TOKEN start no workflow runs."
          } > pr-body.md
          echo "relock=$(jq -s 'any(.[]; .relock)' decision.json decision-semgrep.json)" >> "$GITHUB_OUTPUT"
          echo "issues=$(jq -s 'map(.issues | length) | add' decision.json decision-semgrep.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lock-decision
          path: |
            decision.json
            decision-semgrep.json
            uv.lock.new
            tools/semgrep/uv.lock.new
            pr-body.md
          if-no-files-found: ignore

  refresh-pr:
    name: refresh-pr
    needs: decide
    if: needs.decide.outputs.relock == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One lock refresh at a time across the hourly and the daily workflow: a newer refresh cancels the running one.
    concurrency:
      group: lock-refresh-pr
      cancel-in-progress: true
    permissions:
      contents: write # push the chore/lock-refresh branch
      pull-requests: write # open or refresh the lock pull request
      actions: write # dispatch CI on the pushed lock branch (events caused by GITHUB_TOKEN start no workflow run)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lock-decision

      - name: Open or refresh the lock PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ ! -f uv.lock.new ] || mv uv.lock.new uv.lock
          [ ! -f tools/semgrep/uv.lock.new ] || mv tools/semgrep/uv.lock.new tools/semgrep/uv.lock
          bash .github/scripts/lock_pr.sh chore/lock-refresh "build(deps): refresh uv.lock after the hourly security run" pr-body.md

  open-issues:
    name: open-issues
    needs: decide
    if: needs.decide.outputs.issues != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository
      issues: write # open or refresh one issue per advisory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lock-decision

      - name: Open or refresh one issue per advisory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/lock_issues.py decision.json
          python3 .github/scripts/lock_issues.py decision-semgrep.json
