name: Lock Upgrade

on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:

permissions:
  contents: read # check out the repository

concurrency:
  group: lock-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    name: upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install uv
        run: pip install uv==0.13.4

      - name: Run make upgrade
        run: make upgrade

      - name: Check whether the lock moved
        id: diff
        run: |
          if git diff --quiet -- uv.lock tools/semgrep/uv.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.diff.outputs.changed == 'true'
        with:
          name: upgraded-lock
          path: |
            uv.lock
            tools/semgrep/uv.lock

  refresh-pr:
    name: refresh-pr
    needs: upgrade
    if: needs.upgrade.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One lock refresh at a time across the hourly and the daily workflow: a newer refresh cancels the running one.
    concurrency:
      group: lock-refresh-pr
      cancel-in-progress: true
    permissions:
      contents: write # push the chore/lock-refresh branch
      pull-requests: write # open or refresh the lock pull request
      actions: write # dispatch CI on the pushed lock branch (events caused by GITHUB_TOKEN start no workflow run)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upgraded-lock

      - name: Open or refresh the lock PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Daily make upgrade (D-157): third-party drift inside the 7 day release-age cooldown. Only uv.lock and tools/semgrep/uv.lock change."
            echo
            echo "CI starts through a workflow_dispatch on this branch: events caused by GITHUB_TOKEN start no workflow runs."
          } > pr-body.md
          bash .github/scripts/lock_pr.sh chore/lock-refresh "build(deps): refresh uv.lock with make upgrade" pr-body.md
