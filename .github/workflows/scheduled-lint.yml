name: Scheduled Lint Check

on:
  schedule:
    # NOTE: Mondays @ 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read # check out the repository

concurrency:
  group: scheduled-lint
  cancel-in-progress: false

jobs:
  scheduled-pre-commit:
    name: scheduled-pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Tooling job with no test run: pre-commit and the lock tools need Python 3.11 (filelock 4.2.1, D-164), and mypy keeps python_version 3.10 in pyproject.toml; the test matrix owns the other versions.
          python-version: '3.11'

      - name: Install uv
        run: pip install uv==0.13.4

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run pre-commit checks
        id: precommit
        run: uv run pre-commit run --all-files

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Tooling job with no test run: pre-commit and the lock tools need Python 3.11 (filelock 4.2.1, D-164), and mypy keeps python_version 3.10 in pyproject.toml; the test matrix owns the other versions.
          python-version: '3.11'

      - name: Install the locked docs tools
        run: |
          pip install uv==0.13.4
          uv sync --locked --group docs

      - name: Run markdown checks
        id: markdown
        run: |
          EXIT_CODE=0
          uv run --no-sync pymarkdownlnt scan docs README.md CHANGELOG.md > markdown_output.txt 2>&1 || EXIT_CODE=$?

          OUTPUT=$(cat markdown_output.txt)
          echo "$OUTPUT"
          {
            echo "output<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

