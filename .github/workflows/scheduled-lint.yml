name: Scheduled Lint Check

on:
  schedule:
    # NOTE: Mondays @ 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  scheduled-pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run pre-commit checks
        id: precommit
        run: uv run pre-commit run --all-files

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install the locked docs tools
        run: |
          pip install uv
          uv sync --locked --group docs

      - name: Run markdown checks
        id: markdown
        run: |
          uv run --no-sync pymarkdownlnt scan docs README.md CHANGELOG.md > markdown_output.txt 2>&1
          EXIT_CODE=$?

          OUTPUT=$(cat markdown_output.txt)
          {
            echo "output<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ $EXIT_CODE -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

