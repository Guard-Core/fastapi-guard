name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: code-ql-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job for every language, so the required check context is exactly `code-ql` (a matrix would suffix it
  # with the language).
  code-ql:
    name: code-ql
    runs-on: ubuntu-latest
    permissions:
      actions: read # read the workflow run data the analysis needs
      contents: read # check out the code CodeQL analyzes
      security-events: write # upload the SARIF results to code scanning

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python,actions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          # The category of the earlier `analyze` job, so the existing analyses and alerts carry over.
          category: .github/workflows/code-ql.yml:analyze/language:python
