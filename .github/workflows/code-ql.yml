name: CodeQL

on:
  push:
    branches: [master]
    paths:
      - 'compose.yml'
      - 'data/**'
      - 'Dockerfile'
      - 'examples/**'
      - 'guard/**'
      - 'mypy.ini'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'
      - 'pytest.ini'
      - 'reqs.pip'
      - 'tests/**'
  pull_request:
    branches: [master]
    paths:
      - 'compose.yml'
      - 'data/**'
      - 'Dockerfile'
      - 'examples/**'
      - 'guard/**'
      - 'mypy.ini'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'
      - 'pytest.ini'
      - 'reqs.pip'
      - 'tests/**'
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      matrix:
        language: [python]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

