name: DockSec

on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - '**/Dockerfile'
      - '.github/workflows/docksec.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '**/Dockerfile'
      - '.github/workflows/docksec.yml'
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  scan:
    name: Scan Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run DockSec
        uses: OWASP/DockSec@d52c8e928552dc39003abda21ac6bc4662b06c39 # v2026.9.21
        with:
          dockerfile: Dockerfile
          scan_only: 'true'
          sarif: 'true'
          output_dir: ${{ github.workspace }}/docksec-results

      - name: Upload SARIF to Code Scanning
        # Not `if: always()`: on a fork pull_request, GITHUB_TOKEN is read-only and this
        # upload would fail every time, turning a routine fork contribution into a red
        # required check. Skip it there instead of forcing a failure.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3
        with:
          sarif_file: docksec-results
          category: docksec
