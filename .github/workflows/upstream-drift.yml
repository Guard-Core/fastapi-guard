name: Upstream Drift

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  upstream-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # uv follows .python-version (3.10) unless told otherwise, so the matrix CPython was set up and never used.
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never
      EXPECTED_PYTHON: ${{ matrix.python-version }}

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
      - name: Checkout fastapi-guard
        uses: actions/checkout@v7.0.1

      - name: Checkout guard-core@master
        uses: actions/checkout@v7.0.1
        with:
          repository: Guard-Core/guard-core
          ref: master
          path: guard-core-upstream

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          pip install uv

      - name: Assert uv resolves the matrix interpreter
        run: |
          uv run --no-project python -c "import os, sys; assert '%d.%d' % sys.version_info[:2] == os.environ['EXPECTED_PYTHON'], sys.version; print(sys.version)"

      - name: Build the guard-core wheel from guard-core@master
        run: |
          cd guard-core-upstream
          uv build --wheel --out-dir dist

      - name: Install the fastapi-guard dev environment
        run: |
          uv sync --locked --extra dev

      - name: Force-install the guard-core@master wheel over the resolved one
        run: |
          wheel=$(find guard-core-upstream/dist -name '*.whl')
          uv pip install --python .venv/bin/python --no-deps --force-reinstall "$wheel"
          .venv/bin/python -c "import guard_core; print(guard_core.__version__); print(guard_core.__file__)"

      - name: Run the fastapi-guard test suite against guard-core@master
        run: |
          IPINFO_TOKEN='${{ secrets.IPINFO_TOKEN || 'test_token' }}' REDIS_URL='redis://localhost:6379' REDIS_PREFIX='test:fastapi_guard:' uv run --no-sync pytest -v --cov=guard --cov-branch

